spring.application.name=stats-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:playnode_postgres}:${DB_PORT:5432}/${DB_NAME:playnode_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

mqtt.broker.url=tcp://${MQTT_HOST:playnode-mosquitto}:${MQTT_PORT:1883}
mqtt.client.id=stats-service-client
mqtt.topic=locale/#

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== CORS CONFIGURATION =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:63342,http://localhost:5173,http://localhost:4200,http://127.0.0.1:5500}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}