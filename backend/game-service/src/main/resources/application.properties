spring.application.name=game-service
server.port=8080


spring.datasource.url=jdbc:postgresql://${DB_HOST:playnode_postgres}:${DB_INTERNAL_PORT:5432}/${DB_NAME:playnode_db}
spring.datasource.username=${DB_USER:playnode_admin}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- CONFIGURAZIONI MQTT ---
mqtt.broker.url=tcp://${MQTT_HOST:playnode-mosquitto}:${MQTT_PORT:1883}
mqtt.client.id=game-service-publisher
mqtt.username=${MQTT_USER}
mqtt.password=${MQTT_PASSWORD}

# ===== CORS CONFIGURATION =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:63342,http://localhost:5173,http://localhost:4200,http://127.0.0.1:5500}

# ===== JWT (stessa secret di auth-service) =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
tournament.service.url=http://${TOURNAMENT_HOST:localhost}:8083
