spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:playnode_postgres}:${DB_PORT:5432}/${DB_NAME:playnode_db}

spring.datasource.username=${DB_USER:playnode_admin}
spring.datasource.password=${DB_PASSWORD:playnode_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== JWT CONFIGURATION =====
# Secret key per firmare i JWT token (almeno 256 bit)
jwt.secret=${JWT_SECRET}

# Tempo di scadenza del token in millisecondi
jwt.expiration=${JWT_EXPIRATION}

# ===== CORS CONFIGURATION =====
# Origins consentiti (da SecurityConfig)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:63342,http://localhost:5173,http://localhost:4200,http://127.0.0.1:5500}
